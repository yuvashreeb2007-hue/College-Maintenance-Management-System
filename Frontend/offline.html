<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Offline - CampusFix</title>
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
    }
    .offline-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
    }
    .offline-icon-box {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
      font-size: 32px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.12);
      color: #f59e0b;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .btn-retry {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: background 0.15s ease, transform 0.15s ease;
      text-decoration: none;
    }
    .btn-retry:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-home {
      display: inline-block;
      margin-top: 12px;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-home:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon-box">
      <i class="fa-solid fa-plane-slash"></i>
    </div>
    <div class="badge-pill">
      <i class="fa-solid fa-wifi"></i> No Internet Connection
    </div>
    <h1>CampusFix is currently offline</h1>
    <p>Your network connection appears to be unavailable. Once you reconnect to Wi-Fi or mobile data, CampusFix will automatically resume syncing campus maintenance requests.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      <i class="fa-solid fa-rotate-right"></i> Check Connection Again
    </button>
    <a href="/" class="btn-home">Return to CampusFix Workspace</a>
  </div>
</body>
</html>
